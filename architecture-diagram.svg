<svg width="100%" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Scalable web application architecture on AWS</title>
<desc>Users route through Route 53, CloudFront, WAF and an Application Load Balancer into a VPC spanning two Availability Zones, each with a public subnet (NAT Gateway), a private app subnet (EC2 Auto Scaling Group), and a private DB subnet (Multi-AZ RDS, primary and standby).</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- Row 0: external edge chain -->
<g class="node c-gray"><rect x="40" y="40" width="80" height="44" rx="8" stroke-width="0.5"/><text class="th" x="80" y="62" text-anchor="middle" dominant-baseline="central">Users</text></g>
<line x1="120" y1="62" x2="148" y2="62" class="arr" marker-end="url(#arrow)"/>

<g class="node c-blue"><rect x="150" y="40" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="200" y="62" text-anchor="middle" dominant-baseline="central">Route 53</text></g>
<line x1="250" y1="62" x2="278" y2="62" class="arr" marker-end="url(#arrow)"/>

<g class="node c-blue"><rect x="280" y="40" width="120" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">CloudFront</text></g>
<line x1="400" y1="62" x2="428" y2="62" class="arr" marker-end="url(#arrow)"/>

<g class="node c-blue"><rect x="430" y="40" width="70" height="44" rx="8" stroke-width="0.5"/><text class="th" x="465" y="62" text-anchor="middle" dominant-baseline="central">WAF</text></g>
<line x1="500" y1="62" x2="528" y2="62" class="arr" marker-end="url(#arrow)"/>

<g class="node c-blue"><rect x="530" y="40" width="90" height="44" rx="8" stroke-width="0.5"/><text class="th" x="575" y="62" text-anchor="middle" dominant-baseline="central">ALB</text></g>
<line x1="575" y1="84" x2="575" y2="138" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="580" y="115" text-anchor="start">routes to healthy targets</text>

<!-- VPC container -->
<g class="c-gray"><rect x="30" y="140" width="610" height="450" rx="20" stroke-width="0.5"/><text class="th" x="50" y="168" text-anchor="start">VPC (10.0.0.0/16)</text></g>

<!-- AZ A -->
<g class="c-gray"><rect x="60" y="190" width="260" height="350" rx="14" fill="none" stroke-dasharray="4 3" stroke-width="0.5"/><text class="ts" x="80" y="212" text-anchor="start">Availability Zone A</text></g>
<g class="node c-teal"><rect x="80" y="230" width="220" height="70" rx="10" stroke-width="0.5"/><text class="th" x="190" y="254" text-anchor="middle" dominant-baseline="central">Public subnet</text><text class="ts" x="190" y="274" text-anchor="middle" dominant-baseline="central">NAT gateway</text></g>
<line x1="190" y1="300" x2="190" y2="318" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="80" y="320" width="220" height="90" rx="10" stroke-width="0.5"/><text class="th" x="190" y="352" text-anchor="middle" dominant-baseline="central">Private app subnet</text><text class="ts" x="190" y="372" text-anchor="middle" dominant-baseline="central">EC2 (Auto Scaling Group)</text></g>
<line x1="190" y1="410" x2="190" y2="428" class="arr" marker-end="url(#arrow)"/>
<g class="node c-coral"><rect x="80" y="430" width="220" height="80" rx="10" stroke-width="0.5"/><text class="th" x="190" y="460" text-anchor="middle" dominant-baseline="central">Private DB subnet</text><text class="ts" x="190" y="480" text-anchor="middle" dominant-baseline="central">RDS primary</text></g>

<!-- AZ B -->
<g class="c-gray"><rect x="350" y="190" width="260" height="350" rx="14" fill="none" stroke-dasharray="4 3" stroke-width="0.5"/><text class="ts" x="370" y="212" text-anchor="start">Availability Zone B</text></g>
<g class="node c-teal"><rect x="370" y="230" width="220" height="70" rx="10" stroke-width="0.5"/><text class="th" x="480" y="254" text-anchor="middle" dominant-baseline="central">Public subnet</text><text class="ts" x="480" y="274" text-anchor="middle" dominant-baseline="central">NAT gateway</text></g>
<line x1="480" y1="300" x2="480" y2="318" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="370" y="320" width="220" height="90" rx="10" stroke-width="0.5"/><text class="th" x="480" y="352" text-anchor="middle" dominant-baseline="central">Private app subnet</text><text class="ts" x="480" y="372" text-anchor="middle" dominant-baseline="central">EC2 (Auto Scaling Group)</text></g>
<line x1="480" y1="410" x2="480" y2="428" class="arr" marker-end="url(#arrow)"/>
<g class="node c-coral"><rect x="370" y="430" width="220" height="80" rx="10" stroke-width="0.5"/><text class="th" x="480" y="460" text-anchor="middle" dominant-baseline="central">Private DB subnet</text><text class="ts" x="480" y="480" text-anchor="middle" dominant-baseline="central">RDS standby</text></g>

<!-- sync replication link between DB subnets -->
<line x1="300" y1="470" x2="368" y2="470" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="334" y="460" text-anchor="middle">sync</text>

<!-- ALB fan-out into both public subnets -->
<path d="M575 138 C 575 170, 190 170, 190 228" fill="none" stroke="var(--border-strong)" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M575 138 C 575 170, 480 170, 480 228" fill="none" stroke="var(--border-strong)" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- footnote -->
<text class="ts" x="50" y="618" text-anchor="start">Monitoring: CloudWatch dashboards and alarms, SNS notifications, Systems Manager Session Manager for instance access (no SSH/bastion)</text>
</svg>
